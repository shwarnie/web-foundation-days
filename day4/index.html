<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Note Draft</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main>
    <h1>Note Draft</h1>

    <label for="note-text">Write your note:</label>
    <div class="theme"><button id="theme-toggle" type="button">Dark mode</button>
    </div>

    <textarea id="note-text" rows="10" placeholder="Start typing..."></textarea>

    <p id="char-count">0 / 200 characters</p>
    <p id="word-count">0 words</p>

    <div class="clear-button">
      <button id="clear-btn" type="button">Clear</button>
      
    </div>
  </main>

</body>
</html>
